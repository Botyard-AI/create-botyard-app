name: actions-lock

# Fails when .github/workflows/actions.lock is missing, out of date with the
# workflows, or a locked commit no longer verifies upstream (moved tag,
# rewritten history, replaced repository). The lockfile pins every action the
# workflows run, including actions that other actions call, and the runner
# refuses to start an onboarded job whose dependencies are not in it.
# See docs/releasing.md ("Actions lockfile").
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: actions-lock-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check name in .github/rulesets/main.json.
  actions-lock:
    name: actions-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # v0.4.1 is an immutable GitHub release, so its binary cannot change.
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      # Read-only: resolves every pin against GitHub and writes nothing.
      - name: Verify the lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
