name: Scorecard

# OpenSSF Scorecard: supply-chain posture, published to scorecard.dev for the
# README badge and uploaded to code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the Scorecard API
      contents: read
      actions: read # read workflow runs for the Dangerous-Workflow check
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif
