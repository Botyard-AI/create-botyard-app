name: Release

# Publishes ONE package to npm through trusted publishing (OIDC). There is no
# npm token anywhere: npmjs.com trusts exactly this file, in the npm-publish
# environment, for create-botyard-app, @botyard/runtime, @botyard/botpage and
# @botyard/ui. See docs/releasing.md.
#
# - Started by hand from main. The version is the package's package.json
#   version; CHANGELOG.md must have a "## [<name>@<version>]" section.
# - prepare: read-only, no secrets. Checks, builds, tests and packs the tarball.
# - publish: the only job with id-token: write, gated by the npm-publish
#   environment (main only, team approval, no self-review).
# - github-release: tags <name>@<version> on the released commit and creates
#   the GitHub release from the changelog section.
# - Re-running a failed run resumes it: a version already published from this
#   commit by this workflow is not published again; any other copy fails.

# Shown in the Actions list and the npm-publish approval prompt. Only the
# package is known here: run-name can read inputs but not job outputs, so the
# version (read from package.json by prepare) goes in the run summary instead.
# inputs.package is a fixed choice and run-name is display text, never a shell.
run-name: "Release ${{ inputs.package }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (version comes from its package.json)
        type: choice
        options:
          - create-botyard-app
          - "@botyard/runtime"
          - "@botyard/botpage"
          - "@botyard/ui"

permissions: {}

# One release at a time across the repository; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      published: ${{ steps.resolve.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in a release: a poisoned cache must not reach npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: resolve
        run: node scripts/release/prepare.mjs
        env:
          PACKAGE: ${{ inputs.package }}
      - name: Lint, typecheck, test and build the package and its dependencies
        run: |
          for script in lint typecheck test build; do
            pnpm --filter "${PACKAGE}..." --if-present run "$script"
          done
        env:
          PACKAGE: ${{ inputs.package }}
      # pnpm pack, not npm pack: it rewrites workspace: ranges to real versions.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          pnpm --dir "$DIR" pack --pack-destination "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/dist/"
          ls -l "$RUNNER_TEMP/dist"
          test "$(find "$RUNNER_TEMP/dist" -name '*.tgz' | wc -l)" -eq 1
        env:
          DIR: ${{ steps.resolve.outputs.dir }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Only runs npm publish on a tarball built in prepare. Trusted
          # publishing needs npm >= 11.5.1: Node 22 ships npm 10, and this
          # exact Node 24 ships npm 11.19.1, so no npm is installed ad hoc.
          node-version: "24.22.3"
          package-manager-cache: false
      # The ./ matters: npm reads a bare "dist/x.tgz" as GitHub user/repo
      # shorthand and tries to git ls-remote github.com/dist/x.tgz.
      - name: Publish
        run: npm publish ./dist/*.tgz --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}

  github-release:
    name: github-release
    needs: [prepare, publish]
    # Also runs when publish was skipped because this commit is already on npm.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Tag and create the GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          prerelease=()
          if [ "$DIST_TAG" != latest ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
