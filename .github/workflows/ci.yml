name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Read-only by default. PR runs never receive secrets, and this workflow never
# uses pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the required status check name in .github/rulesets/main.json.
  # Renaming it requires updating the ruleset in the same PR.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run knip
      # Examples install our packages from npm, as a generated app does.
      - run: scripts/check-examples.sh
