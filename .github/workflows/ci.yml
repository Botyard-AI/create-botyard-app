name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Read-only by default. PR runs never receive secrets, and this workflow never
# uses pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the required status check name in .github/rulesets/main.json.
  # Renaming it requires updating the ruleset in the same PR.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      # A release bump (a package's version ahead of npm's latest) must pass CI
      # before release.yml can publish it, so these two steps may pin the
      # bundled template to it. Versions equal to npm's latest keep every check,
      # and the release build itself stays strict. See
      # packages/create-botyard-app/scripts/pin.ts.
      - run: pnpm run test
        env:
          BOTYARD_ALLOW_UNPUBLISHED_BUMP: "1"
      - run: pnpm run build
        env:
          BOTYARD_ALLOW_UNPUBLISHED_BUMP: "1"
      - run: pnpm run knip
      # Starts the built full-app template as `npm start` does (mock runtime)
      # and runs its `npm run smoke` against it.
      - run: pnpm run smoke:template
      # Examples install our packages from npm, as a generated app does.
      - run: scripts/check-examples.sh
      # Adds each block in registry/ to an app generated by the CLI built
      # above, and runs the app's checks. See docs/blocks.md. During a release
      # bump (see above) the generated app pins a version npm does not have
      # yet, so the check installs the published version its lockfile locks.
      - run: pnpm run check:blocks
        env:
          BOTYARD_ALLOW_UNPUBLISHED_BUMP: "1"
