name: zizmor

# Static analysis of the workflows themselves (injection, excessive
# permissions, unpinned actions, credential persistence).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check name in .github/rulesets/main.json.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          # Fail the job on findings instead of uploading SARIF, so the check
          # also works on PRs that cannot write security events.
          advanced-security: false
          persona: regular
