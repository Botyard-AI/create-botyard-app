packages:
  - packages/*
  - tooling/*
  - templates/*

# Supply chain: do not install a dependency version until it has been public
# for 3 days (most malicious releases are pulled within hours).
minimumReleaseAge: 4320
# No exclusions: templates use our own packages as workspace:* (the sources
# here), and the CLI build pins them to their published versions.
# Supply chain: no dependency may run install scripts unless listed here.
onlyBuiltDependencies: []
# wrangler (registry.yml's publish job) depends on these. Their install scripts
# only check the prebuilt binary npm already installed, and a deploy of static
# assets runs neither, so they are listed as deliberately not built.
allowBuilds:
  esbuild: false
  workerd: false
strictDepBuilds: true
# GHSA-g3hv-75wg-m249: minimatch >=7.0.0 <11.0.1 (via typescript-eslint and
# eslint-plugin-sonarjs). ESLint 10 alone does not fix it: remove this once
# typescript-eslint (8.73+) and eslint-plugin-sonarjs depend on minimatch
# 11.0.1 or later, here and in the template's and example's package.json.
overrides:
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
